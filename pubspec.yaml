name: kurszettel
description: "Kurszettel – Podcast-Folgen, Börsentermine und Kurzmeldungen."
publish_to: 'none'
version: 0.3.4+8

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  just_audio: ^0.10.0
  just_audio_background: ^0.0.1-beta.15
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  fonts:
    - family: LibreCaslonText
      fonts:
        - asset: assets/fonts/LibreCaslonText-Regular.ttf
        - asset: assets/fonts/LibreCaslonText-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600

# App-Symbol: nur die beiden Ticks nebeneinander, ohne Schrift (Steffen, 24.11.2026). Erzeugt im Bau mit: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_b1_1024.png"
  adaptive_icon_background: "#0F1A2B"
  adaptive_icon_foreground: "assets/icon/icon_fg_1024.png"
  remove_alpha_ios: true
